<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register · JaiHo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main>
    <h1>Create an account</h1>
    <p th:if="${error}" th:text="${error}" class="message error"></p>

    <form th:action="@{/register}" method="post" class="form">
        <label>Username <input type="text" name="username" maxlength="50" required autofocus></label>
        <label>Password <input type="password" name="password" minlength="8" required></label>
        <button type="submit">Register</button>
    </form>
    <p>Already registered? <a th:href="@{/login}">Log in</a></p>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
